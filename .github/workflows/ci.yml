name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SwiftGridView \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | tail -100

      # Reports library line coverage in the job summary and fails if it drops
      # below the floor. Raise MINIMUM_COVERAGE when coverage climbs; never
      # lower it to make a red build green.
      - name: Report code coverage
        env:
          MINIMUM_COVERAGE: "90"
        run: |
          set -o pipefail
          REPORT=$(xcrun xccov view --report --json TestResults.xcresult)
          TARGET=$(echo "$REPORT" | jq '.targets[] | select(.name == "SwiftGridView")')
          PERCENT=$(echo "$TARGET" | jq -r '.lineCoverage * 100 | . * 100 | round / 100')

          {
            echo "## Code coverage: ${PERCENT}% (floor ${MINIMUM_COVERAGE}%)"
            echo
            echo "| File | Coverage | Lines |"
            echo "| --- | --- | --- |"
            echo "$TARGET" | jq -r '.files[]
              | "| \(.name) | \(.lineCoverage * 100 | . * 100 | round / 100)% | \(.coveredLines)/\(.executableLines) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(echo "$PERCENT < $MINIMUM_COVERAGE" | bc -l)" -eq 1 ]; then
            echo "Coverage ${PERCENT}% is below the ${MINIMUM_COVERAGE}% floor" >&2
            exit 1
          fi

  examples:
    name: Build examples (iOS Simulator)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SwiftGridExample
            project: Examples/Universal/SwiftGridExample.xcodeproj
          - name: SwiftUIDemo
            project: Examples/SwiftUIDemo/SwiftUIDemo.xcodeproj
    steps:
      - uses: actions/checkout@v4

      # A generic destination builds against the simulator SDK without needing a
      # booted device, so this needs none of the simulator selection the tests do.
      - name: Build ${{ matrix.name }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.name }}" \
            -destination "generic/platform=iOS Simulator" \
            | tail -50

  lint:
    name: swift-format (strict)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Tools build
        uses: actions/cache@v4
        with:
          path: Tools/.build
          key: tools-${{ runner.os }}-${{ hashFiles('Tools/Package.swift') }}

      - name: Lint
        run: |
          swift run --package-path Tools -c release swift-format lint \
            --strict --recursive --parallel \
            Sources Tests Package.swift
